\services:
  - type: web
    name: packora-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: packora-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: packora-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-app.vercel.app
databases:
  - name: packora-db
    plan: free
